<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thriftopia</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#fff6f1"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@600;700;800&amp;display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<style>
/* Thriftopia — Cherry Pop. Presentation only. */
:root,
[data-theme=light] {--bg:#faf7ff;--fg:#1d1530;--card:#ffffff;--soft:#ede4ff;--alt:#f3edfb;--mut:#6b6185;--acc:#7c3aed;--on:#ffffff;--ln:#e3d8f5;--h1:#e4d4ff;--h2:#ffe9b8;--h3:#d9f0ff;--focus:rgba(124,58,237,.18);--shadow:rgba(60,30,110,.08);--float-shadow:rgba(60,30,110,.16);--scrim:rgba(29,21,48,.5);color-scheme:light;box-sizing:border-box;}
[data-theme=dark] {--bg:#130f1f;--fg:#f8f4ff;--card:#1e1830;--soft:#2d2250;--alt:#2a2140;--mut:#b9acd6;--acc:#b794ff;--on:#1a0f33;--ln:#413563;--h1:#3a2670;--h2:#4a3416;--h3:#12384a;--focus:rgba(183,148,255,.22);--shadow:rgba(0,0,0,.2);--float-shadow:rgba(0,0,0,.4);--scrim:rgba(8,5,16,.68);color-scheme:dark;}
/* Existing additional appearance choices retain their colour values. */
[data-theme=blue] {
  --bg: #0d1b2e;
  --fg: #f2f7ff;
  --card: #183052;
  --soft: #13263f;
  --alt: #22406b;
  --mut: #9bb3d4;
  --acc: #4ba3ff;
  --on: #06162b;
  --ln: #2b4670;
  --h1: #1c3a66;
  --h2: #27345f;
  --h3: #0f4256;
  --focus: rgba(75, 163, 255, .20);
  --shadow: rgba(0, 0, 0, .17);
  --float-shadow: rgba(0, 0, 0, .35);
  --scrim: rgba(3, 9, 17, .66);
  color-scheme: dark;
}
[data-theme=green] {
  --bg: #0c1f19;
  --fg: #effaf4;
  --card: #17382d;
  --soft: #12291f;
  --alt: #1f4a3a;
  --mut: #9cc2b0;
  --acc: #34d391;
  --on: #04130d;
  --ln: #2a5242;
  --h1: #17513d;
  --h2: #2a4a26;
  --h3: #0f4650;
  --focus: rgba(52, 211, 145, .20);
  --shadow: rgba(0, 0, 0, .17);
  --float-shadow: rgba(0, 0, 0, .35);
  --scrim: rgba(3, 12, 9, .66);
  color-scheme: dark;
}
[hidden] { display: none !important; }
*, *::before, *::after { box-sizing: border-box; }
* { margin: 0; }
html { min-height: 100%; }
body {
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font: 400 15px/1.55 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  padding-top: env(safe-area-inset-top);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; }
button { -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible {
  outline: 3px solid var(--acc);
  outline-offset: 3px;
}
h1, h2, h3, .logo, .nm {
  font-family: 'Plus Jakarta Sans', 'Inter', system-ui, sans-serif;
  font-weight: 700;
  overflow-wrap: anywhere;
}
h2 { font-size: 28px; font-weight: 800; letter-spacing: -.035em; line-height: 1.25; }
h3 { font-size: 19px; letter-spacing: -.025em; line-height: 1.35; }
header {
  position: sticky;
  top: 0;
  z-index: 5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  padding: 18px max(24px, calc((100vw - 1100px) / 2 + 24px));
  background: var(--bg);
  border-bottom: 1px solid var(--ln);
}
header > div:last-child { display: flex; align-items: center; gap: 9px; }
.logo { font-size: 31px; font-weight: 800; letter-spacing: -.055em; line-height: 1.15; color: var(--acc); }
.hb {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  min-height: 44px;
  padding: 10px 17px;
  border: 1px solid var(--ln);
  border-radius: 999px;
  background: var(--card);
  color: var(--fg);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
  cursor: pointer;
  transition: transform .16s, filter .16s;
}
.hb.bag { background: var(--acc); color: var(--on); border-color: var(--acc); }
.hb:active { transform: scale(.97); }
.tg {
  position: relative;
  width: 72px;
  height: 44px;
  flex: none;
  padding: 0;
  border: 1px solid var(--ln);
  border-radius: 999px;
  background: var(--soft);
  cursor: pointer;
}
.tg .k {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 34px;
  height: 34px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--card);
  color: var(--acc);
  box-shadow: 0 2px 6px var(--float-shadow);
  transition: transform .22s ease;
}
.tg svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; grid-area: 1/1; }
.tg .moon { display: none; }
:root[data-theme]:not([data-theme=light]) .tg .k { transform: translateX(28px); }
:root[data-theme]:not([data-theme=light]) .tg .sun { display: none; }
:root[data-theme]:not([data-theme=light]) .tg .moon { display: block; }
.lnk { background: none; border: 0; color: var(--acc); font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
main { max-width: 1100px; margin: auto; padding: 22px 24px calc(124px + env(safe-area-inset-bottom)); }
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 48px;
  max-width: 100%;
  padding: 13px 21px;
  border: 1px solid transparent;
  border-radius: 999px;
  background: var(--acc);
  color: var(--on);
  font-size: 14px;
  font-weight: 700;
  line-height: 1.4;
  text-align: center;
  overflow-wrap: anywhere;
  cursor: pointer;
  transition: filter .15s, transform .15s;
}
.btn:active { transform: scale(.98); }
.btn.alt { background: var(--alt); color: var(--fg); border-color: var(--ln); }
.btn.full { width: 100%; }
.btn.sm { min-height: 44px; padding: 10px 16px; font-size: 13px; }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; filter: none; }
input, select, textarea {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: 50px;
  padding: 13px 15px;
  margin: 7px 0 17px;
  border: 1px solid var(--ln);
  border-radius: 15px;
  background: var(--card);
  color: var(--fg);
  font-size: 16px;
  line-height: 1.45;
  caret-color: var(--acc);
  transition: border-color .15s, box-shadow .15s;
}
input::placeholder, textarea::placeholder { color: var(--mut); opacity: 1; }
input:focus, select:focus, textarea:focus { border-color: var(--acc); box-shadow: 0 0 0 4px var(--focus); outline: 1px solid var(--acc); outline-offset: 0; }
input:-webkit-autofill, input:-webkit-autofill:hover, input:-webkit-autofill:focus {
  -webkit-text-fill-color: var(--fg);
  -webkit-box-shadow: 0 0 0 1000px var(--card) inset;
  caret-color: var(--acc);
}
input[type=checkbox], input[type=radio] { display: inline-block; min-height: 0; width: 18px; height: 18px; padding: 0; margin: 0 8px 0 0; vertical-align: middle; accent-color: var(--acc); }
input[type=file] { padding: 11px; font-size: 13px; }
input[type=file]::file-selector-button { border: 0; border-radius: 9px; padding: 8px 11px; margin-right: 10px; background: var(--soft); color: var(--fg); font: inherit; font-weight: 600; }
textarea { min-height: 104px; resize: vertical; }
#q { background: var(--card); border-color: var(--ln); border-radius: 999px; padding: 15px 21px; min-height: 52px; margin: 0 0 12px; }
label { display: block; font-size: 13px; font-weight: 600; color: var(--mut); }
.eyebrow { font-size: 12px; font-weight: 700; color: var(--acc); overflow-wrap: anywhere; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 5px 3px 20px; scrollbar-width: none; scroll-padding-inline: 3px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; min-height: 44px; white-space: nowrap; padding: 10px 19px; border-radius: 999px; border: 1px solid var(--ln); background: var(--card); color: var(--fg); font-size: 13px; font-weight: 600; cursor: pointer; }
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--on); }
.grid { display: block; column-count: 2; column-gap: 14px; }
.card {
  display: inline-block;
  vertical-align: top;
  width: 100%;
  break-inside: avoid;
  margin: 0 0 18px;
  padding: 8px;
  border: 1px solid var(--ln);
  border-radius: 25px;
  background: var(--card);
  box-shadow: 0 5px 18px var(--shadow);
  transition: box-shadow .18s, transform .18s;
}
.ph { position: relative; display: grid; place-items: center; overflow: hidden; border-radius: 18px; aspect-ratio: auto; }
.ph img { position: static; display: block; width: 100%; max-width: 100%; height: auto; }
.mono { font-size: clamp(56px, 9vw, 100px); color: #fff; opacity: .42; font-weight: 800; letter-spacing: -.05em; }
.heart {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  padding: 0;
  border: 1px solid var(--ln);
  border-radius: 50%;
  background: var(--card);
  color: var(--acc);
  font-size: 23px;
  line-height: 1;
  box-shadow: 0 2px 8px var(--shadow);
  cursor: pointer;
}
.tag { position: absolute; left: 8px; top: 10px; background: var(--acc); color: var(--on); font-size: 11px; font-weight: 700; line-height: 1.3; padding: 6px 10px; border-radius: 999px; }
.info { padding: 13px 6px 7px; }
.nm { font-size: 14px; line-height: 1.35; letter-spacing: -.025em; margin-bottom: 4px; }
.price { margin-top: 8px; font-size: 17px; font-weight: 800; letter-spacing: -.025em; color: var(--fg); }
.card .btn { min-height: 44px; padding: 10px 11px !important; font-size: 13px !important; }
.mut { color: var(--mut); font-size: 13px; line-height: 1.55; overflow-wrap: anywhere; }
.info .mut { font-size: 12px; }
.box { background: var(--card); border: 1px solid var(--ln); border-radius: 23px; padding: 21px; margin-bottom: 14px; overflow-wrap: anywhere; }
nav {
  position: fixed;
  left: 50%;
  transform: translateX(-50%);
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: calc(100% - 24px);
  max-width: 560px;
  display: flex;
  align-items: stretch;
  gap: 2px;
  padding: 6px;
  border: 1px solid var(--ln);
  border-radius: 32px;
  background: var(--card);
  box-shadow: 0 10px 35px var(--float-shadow);
  z-index: 6;
}
nav:empty { display: none; }
nav button { flex: 1 1 0; min-width: 0; min-height: 57px; padding: 9px 2px 8px; border: 0; border-radius: 25px; background: none; color: var(--mut); font-size: 11px; line-height: 1.2; font-weight: 600; cursor: pointer; }
nav svg { display: block; width: 21px; height: 21px; margin: 0 auto 5px; stroke-width: 1.8; }
nav .on { background: var(--soft); color: var(--acc); font-weight: 700; }
.sheet {
  position: fixed;
  inset: 0;
  z-index: 9;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom));
  background: var(--scrim);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}
.sheet > div {
  width: 100%;
  max-width: 560px;
  max-height: calc(100vh - 32px);
  max-height: calc(100dvh - 32px - env(safe-area-inset-top) - env(safe-area-inset-bottom));
  margin: auto;
  padding: 30px 26px;
  overflow: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: var(--ln) var(--card);
  border: 1px solid var(--ln);
  border-radius: 30px;
  background: var(--card);
  box-shadow: 0 24px 85px var(--float-shadow);
}
.sheet > div > .logo { margin-bottom: 5px; }
.sheet .btn.full { display: flex; margin-top: 12px; }
.row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; padding: 9px 0; }
.row > * { min-width: 0; overflow-wrap: anywhere; }
.row.box { padding: 16px 20px; }
.hero {
  padding: 41px 25px 37px;
  margin: 0 0 23px;
  text-align: center;
  border: 1px solid var(--ln);
  border-radius: 32px;
  background: radial-gradient(ellipse at 9% 5%, var(--h1), transparent 67%), radial-gradient(ellipse at 100% 98%, var(--h2), transparent 65%), radial-gradient(ellipse at 60% 110%, var(--h3), transparent 70%), var(--soft);
}
.hero h1 { font-size: clamp(34px, 6vw, 62px); font-weight: 800; line-height: 1.05; letter-spacing: -.055em; margin: 16px 0 14px; }
.hero .mut { font-size: 14px; color: var(--fg); opacity: .8; }
.hero .eyebrow { display: inline-block; background: var(--card); color: var(--fg); padding: 7px 15px; border-radius: 999px; font-size: 12px; line-height: 1.5; box-shadow: 0 2px 5px var(--shadow); }
.acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 12px; }
.acts input, .acts select { flex: 1 1 150px; min-width: 0; margin: 0; padding: 11px 13px; font-size: 16px; }
.acts .btn { flex: 0 1 auto; }
@media (hover: hover) and (pointer: fine) {
  .btn:not(:disabled):hover, .hb:hover { filter: brightness(.96); }
  .card:hover { transform: translateY(-3px); box-shadow: 0 12px 28px var(--float-shadow); }
}
@media (min-width: 600px) { .grid { column-count: 3; column-gap: 18px; } }
@media (min-width: 900px) { .grid { column-count: 4; column-gap: 20px; } }
@media (max-width: 599px) {
  header { padding: 16px 18px; gap: 13px; }
  .logo { font-size: 28px; }
  main { padding: 17px 16px calc(116px + env(safe-area-inset-bottom)); }
  .hero { padding: 30px 18px 28px; border-radius: 26px; margin-bottom: 20px; }
  .hero h1 { font-size: 36px; letter-spacing: -.055em; }
  .hero .mut { font-size: 13px; }
  .card { padding: 6px; border-radius: 21px; }
  .ph { border-radius: 15px; }
  .info { padding: 11px 4px 6px; }
  .nm { font-size: 13px; }
  .price { font-size: 16px; }
  .card .btn { font-size: 12px !important; }
  .sheet > div { padding: 27px 22px; border-radius: 26px; }
}
@media (max-width: 479px) {
  header { flex-wrap: wrap; }
  header > div:last-child { flex: 1 1 100%; justify-content: flex-end; }
  header > div:last-child .tg { margin-right: auto; }
  .hb { padding-inline: 17px; }
  .heart { top: 6px; right: 6px; }
  .tag { left: 6px; top: 9px; padding-inline: 8px; }
  .box { padding: 18px; }
  .row.box { padding: 14px 16px; }
}
@media (max-width: 359px) {
  main { padding-inline: 12px; }
  .grid { column-gap: 10px; }
  .hero { padding-inline: 13px; }
  .hero h1 { font-size: 32px; }
  .hero .eyebrow { font-size: 11px; padding-inline: 12px; }
  .info .mut { font-size: 11px; }
  .card .btn { padding-inline: 6px !important; }
  .sheet { padding-left: 12px; padding-right: 12px; }
  .sheet > div { padding: 24px 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; scroll-behavior: auto !important; }
}
/* Upgrade: look and feel */
.logo{background:linear-gradient(90deg,var(--acc),#ec4899);-webkit-background-clip:text;background-clip:text;color:transparent}
header{backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.hero{position:relative;overflow:hidden;padding:56px 25px 48px}
.hero::before,.hero::after{content:"";position:absolute;border-radius:50%;opacity:.55;pointer-events:none}
.hero::before{width:220px;height:220px;left:-60px;top:-70px;background:var(--h1)}
.hero::after{width:260px;height:260px;right:-80px;bottom:-110px;background:var(--h2)}
.hero>*{position:relative;z-index:1}
.hero .btn{margin:8px 4px 0}
.tick{display:flex;gap:10px;overflow-x:auto;margin:0 0 20px;scrollbar-width:none}
.tick::-webkit-scrollbar{display:none}
.tick span{flex:none;padding:9px 16px;border-radius:999px;background:var(--card);border:1px solid var(--ln);font-size:12px;font-weight:700}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:8px 0 10px}
.how div{background:var(--card);border:1px solid var(--ln);border-radius:22px;padding:18px}
.how b{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--acc);color:var(--on);margin-bottom:10px}
.sec{font-size:22px;margin:26px 0 12px}
.foot{margin-top:30px;padding:26px 22px;border-radius:28px;background:var(--soft);border:1px solid var(--ln);text-align:center}
.foot .acts{justify-content:center}
.foot p{margin:7px 0}
.pol{background:var(--soft);border:1px dashed var(--acc);border-radius:16px;padding:12px 14px;font-size:13px;margin:12px 0}
.badge{display:inline-block;background:var(--acc);color:var(--on);border-radius:999px;padding:3px 10px;font-size:11px;font-weight:700;margin-left:8px}

function draw(){if(!me)return;if(me.is_admin&&tab=='trade')tab='shop';const tabs=me.is_admin?[['shop','Shop'],['orders','Orders'],['wallet','Earnings'],['admin','Admin'],['me','Profile']]:[['shop','Shop'],['trade','Trade'],['wallet','Wallet'],['orders','Orders'],['me','Profile']];document.querySelector('.hb.bag').style.display=me.is_admin?'none':'';

function boot(){me=null;$('#m').innerHTML='';$('#nav').innerHTML='';const up=mode=='up';
$('#ov').innerHTML=`<div class="sheet"><div><div class="mono">T</div><div class="logo" style="font-size:32px">Thriftopia</div><p class="mut" style="margin:8px 0 16px">${up?'Create an account to shop, trade and top up.':'Log in to your account.'}</p>${up?'<label>Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel" placeholder="09XXXXXXXX">':''}<label>Email</label><input id="em" type="email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="email"><label>Password</label><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="At least 6 characters" autocapitalize="none" autocorrect="off" spellcheck="false" onkeydown="if(event.key==='Enter')auth()"><label style="display:flex;align-items:center;margin:-8px 0 14px;cursor:pointer"><input type="checkbox" onchange="$('#pw').type=this.checked?'text':'password'">Show password</label><button class="btn full" onclick="auth()">${up?'Create account':'Log in'}</button>${up?'':'<p style="text-align:center;margin-top:10px"><button class="lnk" style="margin:0" onclick="reset()">Forgot password?</button></p>'}<br><button class="btn alt full" onclick="mode='${up?'in':'up'}';boot()">${up?'I already have an account':'Create an account'}</button></div></div>`}
const fr=m=>{m=String(m||'');
if(/invalid login credentials/i.test(m))return 'Wrong email or password. Check for typos, or tap “Create an account” if you haven’t signed up yet. Forgot it? Tap “Forgot password?”.';
if(/email not confirmed/i.test(m))return 'Please confirm your email first: open the link we sent you (check spam too), then log in.';
if(/rate limit|too many/i.test(m))return 'Too many tries. Please wait a few minutes and try again.';
if(/already registered/i.test(m))return 'That email already has an account. Please log in instead.';
return m};
const auth=()=>run(async()=>{const e=$('#em').value.trim().toLowerCase(),raw=$('#pw').value,pw=raw.trim();if(!e||!raw)return alert('Enter your email and password.');let r;
if(mode=='up'){const n=$('#n').value.trim(),ph=$('#ph').value.trim();if(!n||!ph)return alert('Enter your name and phone number.');if(pw.length<6)return alert('Use at least 6 characters for your password.');
r=await sb.auth.signUp({email:e,password:pw,options:{data:{name:n,phone:ph},emailRedirectTo:location.origin+location.pathname}});
if(!r.error&&r.data.user&&r.data.user.identities&&!r.data.user.identities.length){mode='in';boot();return alert('That email already has an account. Please log in, or tap “Forgot password?”.')}
if(!r.error&&!r.data.session)return alert('Account created! Check your email (and spam folder) to confirm, then log in.')}
else{r=await sb.auth.signInWithPassword({email:e,password:raw});if(r.error&&raw!==pw)r=await sb.auth.signInWithPassword({email:e,password:pw})}
if(r.error)return alert(fr(r.error.message));close_();await load()});
let rec=false;
const reset=()=>run(async()=>{const e=$('#em').value.trim().toLowerCase();if(!e)return alert('Type your email above first.');const r=await sb.auth.resetPasswordForEmail(e);if(r.error)return alert(r.error.message);
$('#ov').innerHTML=`<div class="sheet"><div><h2>Enter your code</h2><p class="mut" style="margin:8px 0 16px">If ${esc(e)} has an account, we’ve emailed it a code. Enter it below.</p><input id="cd" inputmode="numeric" autocomplete="one-time-code" placeholder="Code from your email"><button class="btn full" onclick="verify('${esc(e)}')">Continue</button><br><br><button class="btn alt full" onclick="boot()">Back to login</button></div></div>`});
