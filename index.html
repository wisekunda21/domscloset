<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thriftopia</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e0d0c"><link rel="apple-touch-icon" href="icon-512.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--bg:#f4f1ea;--fg:#14110f;--card:#faf8f3;--mut:#7a746a;--acc:#8a6d3b;--ln:#dcd6c8;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0e0d0c;--fg:#efeae0;--card:#171513;--mut:#9b958a;--acc:#c2a36a;--ln:#2a2723}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3,.logo,.nm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
h2{font-size:30px}h3{font-size:22px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.logo{font-size:22px;letter-spacing:.3em}
.lnk{background:0;border:0;color:var(--fg);font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:18px;cursor:pointer}
main{padding:0 16px 110px;max-width:720px;margin:auto}
.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:2px;padding:13px 18px;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn.alt{background:transparent;color:var(--fg)}.btn.full{width:100%}.btn.sm{padding:7px 10px;font-size:10px}.btn:disabled{opacity:.4}
input,select,textarea{width:100%;padding:12px;border-radius:2px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font:inherit;margin:4px 0 12px}
label,.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}.eyebrow{color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px}.chip{white-space:nowrap;padding:8px 14px;border-radius:2px;border:1px solid var(--ln);background:transparent;color:var(--mut);font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}
.ph{aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden}.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.mono{font-family:'Cormorant Garamond',Georgia,serif;font-size:110px;color:#fff;opacity:.32;font-weight:600}
.heart{position:absolute;top:8px;right:10px;background:0;border:0;color:#fff;font-size:22px;cursor:pointer;text-shadow:0 0 4px #0008}
.tag{position:absolute;left:10px;top:12px;border:1px solid #fff;color:#fff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 8px}
.info{padding:10px 0}.nm{font-size:20px;line-height:1.15;margin-bottom:2px}.price{margin-top:6px;font-weight:600;color:var(--acc)}
.mut{color:var(--mut);font-size:13px}.box{background:var(--card);border:1px solid var(--ln);border-radius:2px;padding:16px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:0;border:0;color:var(--mut);font:inherit;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px;cursor:pointer}nav svg{display:block;margin:0 auto 4px}nav .on{color:var(--fg);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
.hero{padding:24px 0 22px;border-bottom:1px solid var(--ln);margin-bottom:16px}.hero h1{font-size:42px;line-height:1.02;margin:10px 0 12px}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.acts input,.acts select{margin:0;flex:1;min-width:120px;padding:8px}
</style></head><body>
<header><div class="logo">THRIFTOPIA</div><div><button class="lnk" id="inst" hidden onclick="install()">Install</button><button class="lnk" onclick="openCart()">Bag (<span id="cc">0</span>)</button></div></header>
<main id="m"></main><nav id="nav"></nav><div id="ov"></div>
<script>
const CFG={wa:'260977255744',pay:{'Airtel Money':{num:'0977255744',name:'Wisdom Kalumba'},'MTN MoMo':{num:'0961661698',name:'Adrian Daka'}},
areas:{'Pickup in Lusaka (free)':0,'Kabulonga':30,'Woodlands':30,'Chilenje':25,'Matero':35,'Kalingalinga':25,'Other Lusaka':50}};
const sb=supabase.createClient('https://lxoomutcglxrekyhnqic.supabase.co','sb_publishable_gbdBmTnjiwjwujxxA3zdlQ_ukLkOCkN');
const LS=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let cart=LS('thr_c',[]),wish=LS('thr_w',[]),me=null,P=[],D={orders:[],topups:[],trades:[]},A={orders:[],topups:[],trades:[]},tab='shop',cat='All',q='',dp=null,mode='in';
const CATS=['All','Tops','Dresses','Shoes','Bags','Kids'],ST=['Received','Packed','Out for delivery','Delivered'];
const sv=()=>{localStorage.setItem('thr_c',JSON.stringify(cart));localStorage.setItem('thr_w',JSON.stringify(wish))};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=n=>'K'+Number(n).toLocaleString(),$=s=>document.querySelector(s),dt=x=>new Date(x).toLocaleString(),byId=i=>P.find(p=>p.id==i);
const wa=t=>window.open('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(t),'_blank');
const run=async(f)=>{try{await f()}catch(e){alert(e.message||e)}};
function tile(p){return `<div class="card"><div class="ph" style="background:${esc(p.color)}">${p.image_url?`<img src="${esc(p.image_url)}" alt="${esc(p.name)}" loading="lazy">`:`<span class="mono">${esc(p.cat[0])}</span>`}${p.is_new?'<span class="tag">New</span>':''}<button class="heart" onclick="wishT(${p.id})" aria-label="Wishlist">${wish.includes(p.id)?'♥':'♡'}</button></div><div class="info"><div class="nm">${esc(p.name)}</div><div class="mut">${esc(p.cat)} · Size ${esc(p.size)} · ${esc(p.cond)}</div><div class="price">${K(p.price)}</div><button class="btn full" style="margin-top:10px;padding:10px" onclick="add(${p.id})">${cart.includes(p.id)?'In bag ✓':'Add to bag'}</button></div></div>`}
function gridHtml(){const r=P.filter(p=>(cat=='All'||p.cat==cat)&&p.name.toLowerCase().includes(q.toLowerCase()));return r.map(tile).join('')||'<p class="mut">Nothing found.</p>'}
function list(){$('#g').innerHTML=gridHtml()}
const V={
shop:()=>`<div class="hero"><p class="eyebrow">Lusaka · Pre-loved fashion</p><h1>Considered finds.<br>One of a kind.</h1><p class="mut">Every piece is unique. Once it’s gone, it’s gone.</p></div>
<input id="q" placeholder="Search items…" value="${esc(q)}" oninput="q=this.value;list()"><div class="chips">${CATS.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div><div class="grid" id="g">${gridHtml()}</div>`,
trade:()=>`<h2 style="margin:8px 0">Trade in</h2><p class="mut" style="margin-bottom:12px">Send us your clothes. We reply with an offer in store credit or a swap.</p><div class="box">
<label>What are you trading?</label><input id="t1" placeholder="e.g. Zara black jeans"><label>Size</label><input id="t2"><label>Condition</label><select id="t3"><option>Like new</option><option>Good</option><option>Fair</option></select><label>Notes</label><textarea id="t4" rows="2"></textarea>
<p class="mut" style="margin-bottom:10px">After sending, attach 2–3 clear photos in the WhatsApp chat.</p><button class="btn full" onclick="trade()">Send trade request</button></div>
<h3 style="margin:14px 0 6px">Your requests</h3>${D.trades.map(t=>`<div class="box"><div class="row"><b>${esc(t.item)}</b><span class="eyebrow">${esc(t.status)}</span></div><p class="mut">${dt(t.created_at)}</p>${t.offer?`<p>Offer: <b>${esc(t.offer)}</b></p>`:'<p class="mut">Waiting for our offer.</p>'}${t.offer&&['New','Offered'].includes(t.status)?`<div class="acts"><button class="btn sm" onclick="resp(${t.id},true)">Accept</button><button class="btn sm alt" onclick="resp(${t.id},false)">Decline</button></div>`:''}</div>`).join('')||'<p class="mut">No trade requests yet.</p>'}`,
wallet:()=>`<h2 style="margin:8px 0">Wallet</h2><div class="box"><p class="eyebrow">Balance</p><h2 style="font-size:46px">${K(me.balance)}</h2><p class="mut">Updated once your top-up is confirmed.</p></div><div class="box"><h3>Top up</h3><label>Pay by</label><select id="tm" onchange="pinfo()">${Object.keys(CFG.pay).map(k=>`<option>${k}</option>`).join('')}</select><p class="mut" id="ti" style="margin-bottom:12px"></p><label>Amount (K)</label><input id="a" type="number" inputmode="numeric"><label>Transaction reference</label><input id="r"><button class="btn full" onclick="topup()">I’ve paid, confirm top-up</button></div>
<h3 style="margin:14px 0 6px">History</h3>${D.topups.map(t=>`<div class="row box"><span>${K(t.amount)} · ${esc(t.ref)}<br><span class="mut">${dt(t.created_at)}</span></span><b>${esc(t.status)}</b></div>`).join('')||'<p class="mut">No top-ups yet.</p>'}`,
orders:()=>`<h2 style="margin:8px 0">Orders</h2>${D.orders.map(o=>`<div class="box"><div class="row"><b>#${o.id}</b><span class="eyebrow">${esc(o.status)}</span></div><p class="mut">${dt(o.created_at)}</p><p>${o.items.map(i=>esc(i.name)).join(', ')}</p><b>${K(o.total)}</b><p class="mut">${esc(o.area)} · ${esc(o.method)}</p><div class="mut" style="margin-top:6px">Received → Packed → Out for delivery → Delivered</div></div>`).join('')||'<p class="mut">No orders yet.</p>'}`,
me:()=>`<h2 style="margin:8px 0">Profile</h2><div class="box"><b>${esc(me.name)}</b><p class="mut">${esc(me.phone)} · ${esc(me.email)}</p></div><div class="box"><h3>Install the app</h3><p class="mut">Add Thriftopia to your home screen.</p><br><button class="btn full" onclick="install()">Install Thriftopia</button></div>
<div class="box"><h3>Wishlist</h3><div class="grid">${wish.map(byId).filter(Boolean).map(tile).join('')||'<p class="mut">Tap the heart on any item.</p>'}</div></div><button class="btn alt full" onclick="out()">Log out</button>`,
admin:()=>`<h2 style="margin:8px 0">Admin</h2><div class="box"><h3>Add item</h3><label>Name</label><input id="an"><label>Category</label><select id="ac">${CATS.slice(1).map(c=>`<option>${c}</option>`).join('')}</select><label>Size</label><input id="as" value="One size"><label>Condition</label><select id="aq"><option>Like new</option><option selected>Good</option><option>Fair</option></select><label>Price (K)</label><input id="ap" type="number" inputmode="numeric"><label>Photo</label><input id="af" type="file" accept="image/*"><label><input id="aw" type="checkbox" style="width:auto;margin-right:8px">Mark as new</label><br><br><button class="btn full" onclick="addP()">Add item</button></div>
<h3 style="margin:14px 0 6px">Top-ups to review</h3>${A.topups.filter(t=>t.status=='Pending').map(t=>`<div class="box"><b>${K(t.amount)}</b> · ${esc(t.method)} · ${esc(t.ref)}<p class="mut">${esc(t.profiles?.name)} ${esc(t.profiles?.phone)} · ${dt(t.created_at)}</p><div class="acts"><button class="btn sm" onclick="apr(${t.id},true)">Approve</button><button class="btn sm alt" onclick="apr(${t.id},false)">Reject</button></div></div>`).join('')||'<p class="mut">Nothing pending.</p>'}
<h3 style="margin:14px 0 6px">Orders</h3>${A.orders.map(o=>`<div class="box"><div class="row"><b>#${o.id} · ${K(o.total)}</b><span class="eyebrow">${esc(o.status)}</span></div><p>${o.items.map(i=>esc(i.name)).join(', ')}</p><p class="mut">${esc(o.profiles?.name)} ${esc(o.profiles?.phone)}<br>${esc(o.area)} · ${esc(o.method)}${o.ref?' · ref '+esc(o.ref):''}</p>${['Cancelled','Delivered'].includes(o.status)?'':`<div class="acts"><select onchange="stat(${o.id},this.value)">${ST.map(s=>`<option ${s==o.status?'selected':''}>${s}</option>`).join('')}</select><button class="btn sm alt" onclick="cancelO(${o.id})">Cancel order</button></div>`}</div>`).join('')||'<p class="mut">No orders.</p>'}
<h3 style="margin:14px 0 6px">Trade-ins</h3>${A.trades.map(t=>`<div class="box"><div class="row"><b>${esc(t.item)}</b><span class="eyebrow">${esc(t.status)}</span></div><p class="mut">${esc(t.size)} · ${esc(t.cond)} · ${esc(t.notes)}<br>${esc(t.profiles?.name)} ${esc(t.profiles?.phone)}</p>${['New','Offered'].includes(t.status)?`<div class="acts"><input id="of${t.id}" placeholder="Offer, e.g. K80 credit" value="${esc(t.offer)}"><button class="btn sm" onclick="offer(${t.id})">Send offer</button></div>`:`<p>Offer: ${esc(t.offer)}</p>`}</div>`).join('')||'<p class="mut">No trade-ins.</p>'}
<h3 style="margin:14px 0 6px">Items for sale</h3>${P.map(p=>`<div class="row"><span>${esc(p.name)} <span class="mut">${K(p.price)}</span></span><button class="btn sm alt" onclick="delP(${p.id})">Delete</button></div>`).join('')}`};
const sv_=d=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={shop:sv_('<path d="M3 10l9-7 9 7v10H3z"/>'),trade:sv_('<path d="M4 8h14l-3-3M20 16H6l3 3"/>'),wallet:sv_('<rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M16 14h2"/>'),orders:sv_('<path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/>'),me:sv_('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>'),admin:sv_('<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/>')};
function draw(){if(!me)return;const tabs=[['shop','Shop'],['trade','Trade'],['wallet','Wallet'],['orders','Orders'],['me','Profile']];if(me.is_admin)tabs.push(['admin','Admin']);
$('#m').innerHTML=V[tab]();$('#cc').textContent=cart.length;$('#nav').innerHTML=tabs.map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';draw();scrollTo(0,0)">${IC[a[0]]}${a[1]}</button>`).join('');if(tab=='wallet')pinfo()}
function pinfo(){const c=CFG.pay[$('#tm').value];$('#ti').innerHTML=`Send to <b>${c.num}</b> (name: <b>${c.name}</b>), then enter the details.`}
function add(i){cart=cart.includes(i)?cart.filter(x=>x!=i):[...cart,i];sv();draw()}
function wishT(i){wish=wish.includes(i)?wish.filter(x=>x!=i):[...wish,i];sv();draw()}
function close_(){$('#ov').innerHTML=''}
function openCart(){if(!me)return;const it=cart.map(byId).filter(Boolean),sub=it.reduce((a,p)=>a+p.price,0);
$('#ov').innerHTML=`<div class="sheet" onclick="if(event.target==this)close_()"><div><h2>Your bag</h2>${it.map(p=>`<div class="row"><span>${esc(p.name)}<br><span class="mut">Size ${esc(p.size)}</span></span><span>${K(p.price)} <button class="chip" onclick="add(${p.id});openCart()">✕</button></span></div>`).join('')||'<p class="mut">Your bag is empty.</p>'}
${it.length?`<label>Delivery</label><select id="ar" onchange="tot()">${Object.entries(CFG.areas).map(([k,v])=>`<option value="${v}">${k}${v?' (+K'+v+')':''}</option>`).join('')}</select>
<label>Pay with</label><select id="py" onchange="tot()"><option value="Wallet">Wallet (${K(me.balance)})</option>${Object.keys(CFG.pay).map(k=>`<option>${k}</option>`).join('')}</select>
<div class="box" id="pi" hidden><p class="mut">Send <b id="tt"></b> to <b id="pn"></b>, then enter the reference.</p><br><input id="rf" placeholder="Transaction reference"></div>
<div class="row"><b>Total</b><b id="tt2"></b></div><button class="btn full" onclick="order()">Place order</button>`:''}</div></div>`;if(it.length)tot()}
function tot(){const s=cart.reduce((a,i)=>a+byId(i).price,0)+ +$('#ar').value,m=$('#py').value;$('#tt').textContent=$('#tt2').textContent=K(s);$('#pi').hidden=m=='Wallet';if(m!='Wallet'){const c=CFG.pay[m];$('#pn').textContent=c.num+' (name: '+c.name+')'}}
const order=()=>run(async()=>{const it=cart.map(byId).filter(Boolean),f=+$('#ar').value,m=$('#py').value,ref=m=='Wallet'?'':$('#rf').value.trim(),ar=$('#ar').selectedOptions[0].text;
if(m!='Wallet'&&!ref)return alert('Enter your payment reference after paying.');
const t=it.reduce((a,p)=>a+p.price,0)+f,r=await sb.rpc('place_order',{p_ids:it.map(p=>p.id),p_fee:f,p_area:ar,p_method:m,p_ref:ref||null});
if(r.error){await load();return alert(r.error.message)}
wa(`New Thriftopia order #${r.data}\nName: ${me.name}\nPhone: ${me.phone}\n${it.map(p=>`- ${p.name} (${p.size}) ${K(p.price)}`).join('\n')}\nDelivery: ${ar}\nTotal: ${K(t)}\nPaid via ${m}${ref?', ref: '+ref:''}`);
cart=[];sv();close_();tab='orders';await load()});
const topup=()=>run(async()=>{const a=+$('#a').value,r=$('#r').value.trim(),m=$('#tm').value;if(!(a>0)||!r)return alert('Enter amount and reference.');
const e=(await sb.from('topups').insert({user_id:me.id,amount:a,method:m,ref:r})).error;if(e)return alert(e.message);
wa(`Thriftopia top-up request\nName: ${me.name}\nPhone: ${me.phone}\nAmount: ${K(a)}\n${m} ref: ${r}`);await load()});
const trade=()=>run(async()=>{const g=i=>$('#t'+i).value.trim();if(!g(1))return alert('Tell us what you’re trading.');
const e=(await sb.from('trades').insert({user_id:me.id,item:g(1),size:g(2),cond:g(3),notes:g(4)})).error;if(e)return alert(e.message);
wa(`Thriftopia trade-in request\nName: ${me.name}\nPhone: ${me.phone}\nItem: ${g(1)}\nSize: ${g(2)}\nCondition: ${g(3)}\nNotes: ${g(4)}`);await load()});
const resp=(id,ok)=>run(async()=>{const e=(await sb.rpc('respond_trade',{p_id:id,p_accept:ok})).error;if(e)alert(e.message);await load()});
// admin
const addP=()=>run(async()=>{const n=$('#an').value.trim(),p=+$('#ap').value;if(!n||!(p>0))return alert('Enter a name and price.');let url=null;const f=$('#af').files[0];
if(f){const path=Date.now()+'-'+f.name.replace(/[^\w.]/g,'_'),u=await sb.storage.from('photos').upload(path,f);if(u.error)return alert(u.error.message);url=sb.storage.from('photos').getPublicUrl(path).data.publicUrl}
const e=(await sb.from('products').insert({name:n,cat:$('#ac').value,size:$('#as').value.trim()||'One size',cond:$('#aq').value,price:p,image_url:url,is_new:$('#aw').checked})).error;if(e)return alert(e.message);await load()});
const delP=id=>run(async()=>{if(!confirm('Delete this item?'))return;const e=(await sb.from('products').delete().eq('id',id)).error;if(e)alert(e.message);await load()});
const apr=(id,ok)=>run(async()=>{const e=(await sb.rpc('approve_topup',{p_id:id,p_ok:ok})).error;if(e)alert(e.message);await load()});
const stat=(id,s)=>run(async()=>{const e=(await sb.from('orders').update({status:s}).eq('id',id)).error;if(e)alert(e.message);await load()});
const cancelO=id=>run(async()=>{if(!confirm('Cancel this order? Items go back on sale and wallet payments are refunded.'))return;const e=(await sb.rpc('cancel_order',{p_id:id})).error;if(e)alert(e.message);await load()});
const offer=id=>run(async()=>{const v=$('#of'+id).value.trim();if(!v)return alert('Enter an offer.');const e=(await sb.from('trades').update({offer:v,status:'Offered'}).eq('id',id)).error;if(e)alert(e.message);await load()});
// auth + data
function boot(){me=null;$('#m').innerHTML='';$('#nav').innerHTML='';const up=mode=='up';
$('#ov').innerHTML=`<div class="sheet"><div><div class="logo" style="font-size:28px">THRIFTOPIA</div><p class="mut" style="margin:8px 0 16px">${up?'Create an account to shop, trade and top up.':'Log in to your account.'}</p>${up?'<label>Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel" placeholder="09XXXXXXXX">':''}<label>Email</label><input id="em" type="email" autocomplete="email"><label>Password</label><input id="pw" type="password" autocomplete="${up?'new-password':'current-password'}" placeholder="At least 6 characters"><button class="btn full" onclick="auth()">${up?'Create account':'Log in'}</button><br><br><button class="btn alt full" onclick="mode='${up?'in':'up'}';boot()">${up?'I already have an account':'Create an account'}</button></div></div>`}
const auth=()=>run(async()=>{const e=$('#em').value.trim(),pw=$('#pw').value;if(!e||!pw)return alert('Enter your email and password.');let r;
if(mode=='up'){const n=$('#n').value.trim(),ph=$('#ph').value.trim();if(!n||!ph)return alert('Enter your name and phone number.');r=await sb.auth.signUp({email:e,password:pw,options:{data:{name:n,phone:ph}}});if(!r.error&&!r.data.session)return alert('Account created. Check your email to confirm, then log in.')}
else r=await sb.auth.signInWithPassword({email:e,password:pw});
if(r.error)return alert(r.error.message);close_();await load()});
