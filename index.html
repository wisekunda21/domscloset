<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Thriftopia</title>
<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0e0d0c"><link rel="apple-touch-icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f1ea;--fg:#14110f;--card:#faf8f3;--mut:#7a746a;--acc:#8a6d3b;--ln:#dcd6c8;box-sizing:border-box}
@media(prefers-color-scheme:dark){:root{--bg:#0e0d0c;--fg:#efeae0;--card:#171513;--mut:#9b958a;--acc:#c2a36a;--ln:#2a2723}}
*{box-sizing:border-box;margin:0}html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14.5px/1.5 'Inter',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;padding-top:env(safe-area-inset-top)}
h1,h2,h3,.logo,.nm{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600}
h2{font-size:30px}h3{font-size:22px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--ln);display:flex;align-items:center;justify-content:space-between;padding:14px 16px}
.logo{font-size:22px;letter-spacing:.3em}
.lnk{background:0;border:0;color:var(--fg);font:inherit;font-size:11px;letter-spacing:.14em;text-transform:uppercase;margin-left:18px;cursor:pointer}
main{padding:0 16px 110px;max-width:720px;margin:auto}
.btn{background:var(--fg);color:var(--bg);border:1px solid var(--fg);border-radius:2px;padding:13px 18px;font:inherit;font-size:11.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;cursor:pointer}
.btn.alt{background:transparent;color:var(--fg)}.btn.full{width:100%}.btn:disabled{opacity:.4}
input,select,textarea{width:100%;padding:12px;border-radius:2px;border:1px solid var(--ln);background:var(--card);color:var(--fg);font:inherit;margin:4px 0 12px}
label,.eyebrow{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mut)}.eyebrow{color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 16px}.chip{white-space:nowrap;padding:8px 14px;border-radius:2px;border:1px solid var(--ln);background:transparent;color:var(--mut);font:inherit;font-size:11px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px 14px}
.ph{aspect-ratio:4/5;display:grid;place-items:center;position:relative}
.mono{font-family:'Cormorant Garamond',Georgia,serif;font-size:110px;color:#fff;opacity:.32;font-weight:600}
.heart{position:absolute;top:8px;right:10px;background:0;border:0;color:#fff;font-size:22px;cursor:pointer}
.tag{position:absolute;left:10px;top:12px;border:1px solid #fff;color:#fff;font-size:10px;letter-spacing:.16em;text-transform:uppercase;padding:3px 8px}
.info{padding:10px 0}.nm{font-size:20px;line-height:1.15;margin-bottom:2px}.price{margin-top:6px;font-weight:600;color:var(--acc)}
.mut{color:var(--mut);font-size:13px}.box{background:var(--card);border:1px solid var(--ln);border-radius:2px;padding:16px;margin-bottom:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:var(--bg);border-top:1px solid var(--ln);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:0;border:0;color:var(--mut);font:inherit;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;padding:4px;cursor:pointer}nav svg{display:block;margin:0 auto 4px}nav .on{color:var(--fg);font-weight:600}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9;display:flex;align-items:flex-end}
.sheet>div{background:var(--bg);width:100%;max-height:90%;overflow:auto;padding:24px 16px calc(24px + env(safe-area-inset-bottom));max-width:720px;margin:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0}
.hero{padding:24px 0 22px;border-bottom:1px solid var(--ln);margin-bottom:16px}.hero h1{font-size:42px;line-height:1.02;margin:10px 0 12px}
</style></head><body>
<header><div class="logo">THRIFTOPIA</div><div><button class="lnk" id="inst" hidden onclick="install()">Install</button><button class="lnk" onclick="openCart()">Bag (<span id="cc">0</span>)</button></div></header>
<main id="m"></main>
<nav id="nav"></nav><div id="ov"></div>
<script>
const CFG={wa:'260977255744',pay:{'Airtel Money':{num:'0977255744',name:'Wisdom Kalumba'},'MTN MoMo':{num:'0961661698',name:'Adrian Daka'}},
areas:{'Pickup in Lusaka (free)':0,'Kabulonga':30,'Woodlands':30,'Chilenje':25,'Matero':35,'Kalingalinga':25,'Other Lusaka':50}};
const P=[
['Oversized denim jacket','Tops','M','Like new',180,'#6f7a86',1],['Floral summer dress','Dresses','S','Good',120,'#a08c8c'],
['Leather loafers','Shoes','42','Good',250,'#7a6652'],['Leather crossbody bag','Bags','One size','Like new',150,'#9b7e6b',1],
['Linen shirt','Tops','L','Good',60,'#b0a18f'],['Kids puffer jacket','Kids','Age 6','Good',90,'#8c9a8a'],
['Pleated midi skirt','Dresses','M','Like new',100,'#7d8470'],['Canvas sneakers','Shoes','40','Fair',110,'#8a8f94']
].map((a,i)=>({id:i,n:a[0],c:a[1],s:a[2],q:a[3],p:a[4],col:a[5],nw:a[6]}));
const CATS=['All','Tops','Dresses','Shoes','Bags','Kids'];
let S=JSON.parse(localStorage.getItem('thr')||'{"cart":[],"wish":[],"orders":[],"topups":[],"user":null}');
let tab='shop',cat='All',q='',dp=null;
const sv=()=>localStorage.setItem('thr',JSON.stringify(S)),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const K=n=>'K'+n.toLocaleString(),$=s=>document.querySelector(s);
const wa=t=>window.open('https://wa.me/'+CFG.wa+'?text='+encodeURIComponent(t),'_blank');
function tile(p){return `<div class="card"><div class="ph" style="background:${p.col}"><span class="mono">${p.c[0]}</span>${p.nw?'<span class="tag">New</span>':''}<button class="heart" onclick="wish(${p.id})" aria-label="Wishlist">${S.wish.includes(p.id)?'♥':'♡'}</button></div><div class="info"><div class="nm">${p.n}</div><div class="mut">${p.c} · Size ${p.s} · ${p.q}</div><div class="price">${K(p.p)}</div><button class="btn full" style="margin-top:10px;padding:10px" onclick="add(${p.id})">${S.cart.includes(p.id)?'In bag ✓':'Add to bag'}</button></div></div>`}
const V={
shop:()=>`<div class="hero"><p class="eyebrow">Lusaka · Pre-loved fashion</p><h1>Considered finds.<br>One of a kind.</h1><p class="mut">Every piece is unique. Once it’s gone, it’s gone.</p></div>
<input id="q" placeholder="Search items…" value="${esc(q)}" oninput="q=this.value;list()"><div class="chips">${CATS.map(c=>`<button class="chip ${c==cat?'on':''}" onclick="cat='${c}';draw()">${c}</button>`).join('')}</div><div class="grid" id="g">${gridHtml()}</div>`,
trade:()=>`<h2 style="margin:8px 0">Trade in</h2><p class="mut" style="margin-bottom:12px">Send us your clothes. We reply on WhatsApp with an offer in store credit or a swap.</p><div class="box">
<label>What are you trading?</label><input id="t1" placeholder="e.g. Zara black jeans"><label>Size</label><input id="t2"><label>Condition</label><select id="t3"><option>Like new</option><option>Good</option><option>Fair</option></select><label>Notes</label><textarea id="t4" rows="2"></textarea>
<p class="mut" style="margin-bottom:10px">After sending, attach 2–3 clear photos in the WhatsApp chat.</p><button class="btn full" onclick="trade()">Send trade request</button></div>`,
wallet:()=>`<h2 style="margin:8px 0">Wallet</h2><div class="box"><p class="eyebrow">Balance</p><h2 style="font-size:46px">K0</h2><p class="mut">Updated once your top-up is confirmed.</p></div><div class="box"><h3>Top up</h3><label>Pay by</label><select id="tm" onchange="pinfo('tm','ti')">${Object.keys(CFG.pay).map(k=>`<option>${k}</option>`).join('')}</select><p class="mut" id="ti" style="margin-bottom:12px"></p><label>Amount (K)</label><input id="a" type="number" inputmode="numeric"><label>Transaction reference</label><input id="r"><button class="btn full" onclick="topup()">I’ve paid, confirm top-up</button></div>
<h3 style="margin:14px 0 6px">History</h3>${S.topups.map(t=>`<div class="row box"><span>${K(t.a)} · ${esc(t.r)}<br><span class="mut">${t.d}</span></span><b>Pending</b></div>`).join('')||'<p class="mut">No top-ups yet.</p>'}`,
orders:()=>`<h2 style="margin:8px 0">Orders</h2>${S.orders.map(o=>`<div class="box"><div class="row"><b>#${o.id}</b><span class="eyebrow">${o.st}</span></div><p class="mut">${o.d}</p><p>${o.items.join(', ')}</p><b>${K(o.t)}</b><p class="mut">${o.area} · ${esc(o.pay)}</p><div class="mut" style="margin-top:6px">Received → Packed → Out for delivery → Delivered</div></div>`).join('')||'<p class="mut">No orders yet.</p>'}`,
me:()=>`<h2 style="margin:8px 0">Profile</h2><div class="box"><b>${esc(S.user.name)}</b><p class="mut">${esc(S.user.phone)}</p></div><div class="box"><h3>Install the app</h3><p class="mut" id="ih">Tap Install at the top to add Thriftopia to your phone.</p><br><button class="btn full" onclick="install()">Install Thriftopia</button></div>
<div class="box"><h3>Wishlist</h3><div class="grid">${S.wish.map(i=>tile(P[i])).join('')||'<p class="mut">Tap the heart on any item.</p>'}</div></div><button class="btn alt full" onclick="S.user=null;sv();boot()">Log out</button>`};
function gridHtml(){const r=P.filter(p=>(cat=='All'||p.c==cat)&&p.n.toLowerCase().includes(q.toLowerCase()));return r.map(tile).join('')||'<p class="mut">Nothing found.</p>'}
function list(){$('#g').innerHTML=gridHtml()}
const sv_=(d)=>`<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
const IC={shop:sv_('<path d="M3 10l9-7 9 7v10H3z"/>'),trade:sv_('<path d="M4 8h14l-3-3M20 16H6l3 3"/>'),wallet:sv_('<rect x="3" y="6" width="18" height="13" rx="1"/><path d="M3 10h18M16 14h2"/>'),orders:sv_('<path d="M4 7l8-4 8 4v10l-8 4-8-4zM4 7l8 4 8-4M12 11v10"/>'),me:sv_('<circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/>')};
function draw(){$('#m').innerHTML=V[tab]();$('#cc').textContent=S.cart.length;$('#nav').innerHTML=[['shop','Shop'],['trade','Trade'],['wallet','Wallet'],['orders','Orders'],['me','Profile']].map(a=>`<button class="${tab==a[0]?'on':''}" onclick="tab='${a[0]}';draw();scrollTo(0,0)">${IC[a[0]]}${a[1]}</button>`).join('');if(tab=='wallet')pinfo('tm','ti')}
function pinfo(a,b){const c=CFG.pay[$('#'+a).value];$('#'+b).innerHTML=`Send to <b>${c.num}</b> (name: <b>${c.name}</b>), then enter the details.`}
function add(i){S.cart.includes(i)?S.cart=S.cart.filter(x=>x!=i):S.cart.push(i);sv();draw()}
function wish(i){S.wish.includes(i)?S.wish=S.wish.filter(x=>x!=i):S.wish.push(i);sv();draw()}
function close_(){$('#ov').innerHTML=''}
function openCart(){const it=S.cart.map(i=>P[i]),sub=it.reduce((a,p)=>a+p.p,0);
$('#ov').innerHTML=`<div class="sheet" onclick="if(event.target==this)close_()"><div><h2>Your bag</h2>${it.map(p=>`<div class="row"><span>${p.n}<br><span class="mut">Size ${p.s}</span></span><span>${K(p.p)} <button class="chip" onclick="add(${p.id});openCart()">✕</button></span></div>`).join('')||'<p class="mut">Your bag is empty.</p>'}
${it.length?`<label>Delivery</label><select id="ar" onchange="tot()">${Object.entries(CFG.areas).map(([k,v])=>`<option value="${v}">${k}${v?' (+K'+v+')':''}</option>`).join('')}</select>
<label>Pay with</label><select id="py" onchange="tot()">${Object.keys(CFG.pay).map(k=>`<option>${k}</option>`).join('')}</select>
<div class="box" id="pi"><p class="mut">Send <b id="tt"></b> to <b id="pn"></b>, then enter the reference.</p><br><input id="rf" placeholder="Transaction reference"></div>
<div class="row"><b>Total</b><b id="tt2"></b></div><button class="btn full" onclick="order()">Place order on WhatsApp</button>`:''}</div></div>`;if(it.length)tot()}
function tot(){const s=S.cart.reduce((a,i)=>a+P[i].p,0)+ +$('#ar').value;$('#tt').textContent=$('#tt2').textContent=K(s);const c=CFG.pay[$('#py').value];$('#pn').textContent=c.num+' (name: '+c.name+')'}
function order(){const it=S.cart.map(i=>P[i]),f=+$('#ar').value,t=it.reduce((a,p)=>a+p.p,0)+f,ref=$('#rf').value.trim(),ar=$('#ar').selectedOptions[0].text;
if(!ref)return alert('Enter your payment reference after paying.');
const id=Date.now().toString().slice(-6),o={id,st:'Received',d:new Date().toLocaleString(),items:it.map(p=>p.n),t,area:ar,pay:$('#py').value+' ref '+ref};
S.orders.unshift(o);S.cart=[];sv();
wa(`New Thriftopia order #${id}\nName: ${S.user.name}\nPhone: ${S.user.phone}\n${it.map(p=>`- ${p.n} (${p.s}) ${K(p.p)}`).join('\n')}\nDelivery: ${ar}\nTotal: ${K(t)}\nPaid via ${$('#py').value}, ref: ${ref}`);
close_();tab='orders';draw()}
function topup(){const a=+$('#a').value,r=$('#r').value.trim();if(!a||!r)return alert('Enter amount and reference.');
S.topups.unshift({a,r,d:new Date().toLocaleString()});sv();wa(`Thriftopia top-up request\nName: ${S.user.name}\nPhone: ${S.user.phone}\nAmount: ${K(a)}\n${$('#tm').value} ref: ${r}`);draw()}
function trade(){const g=i=>$('#t'+i).value.trim();if(!g(1))return alert('Tell us what you’re trading.');
wa(`Thriftopia trade-in request\nName: ${S.user.name}\nPhone: ${S.user.phone}\nItem: ${g(1)}\nSize: ${g(2)}\nCondition: ${g(3)}\nNotes: ${g(4)}`)}
function boot(){if(S.user)return draw();$('#m').innerHTML='';$('#nav').innerHTML='';
$('#ov').innerHTML=`<div class="sheet"><div><div class="logo" style="font-size:28px">THRIFTOPIA</div><p class="mut" style="margin:8px 0 16px">Sign up to shop, trade and top up.</p><label>Your name</label><input id="n"><label>Phone number</label><input id="ph" type="tel" placeholder="09XXXXXXXX"><button class="btn full" onclick="login()">Continue</button><br><br><button class="btn alt full" onclick="install()">Install Thriftopia</button><p class="mut" id="ih2" style="margin-top:8px"></p></div></div>`}
function login(){const n=$('#n').value.trim(),p=$('#ph').value.trim();if(!n||!p)return alert('Enter your name and phone number.');S.user={name:n,phone:p};sv();close_();draw()}
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent),stand=matchMedia('(display-mode:standalone)').matches||navigator.standalone;
function install(){if(dp){dp.prompt();dp=null;$('#inst').hidden=true}else if(stand)alert('Thriftopia is already installed.');else if(ios)alert('On iPhone: tap the Share button in Safari, then “Add to Home Screen”.');else alert('Open your browser menu (⋮) and tap “Install app” or “Add to Home screen”.')}
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;$('#inst').hidden=false});
if(!stand)$('#inst').hidden=false;
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>
